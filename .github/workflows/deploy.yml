name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # weekly refresh, Mondays 06:00 BRT
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: npm ci
      # Raw downloads and API responses; keeps the optional Bolsa Família loader
      # from re-querying the rate-limited API on every run.
      - uses: actions/cache@v4
        with:
          path: data_cache
          key: data-${{ github.run_id }}
          restore-keys: data-
      - run: npm run build
        env:
          # Optional. Without it, only the Bolsa Família page is empty.
          PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
      # Compare this build's data manifest with the one currently live and report
      # changes in the job summary; large drops show up as warnings. Add --strict
      # to the compare command to block the deploy instead.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Compare data with the live site
        run: |
          curl -fsSL "${{ steps.pages.outputs.base_url }}/manifest.json" -o previous-manifest.json || echo "No live manifest yet"
          uv run python -m pipeline.manifest compare previous-manifest.json dist/manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
